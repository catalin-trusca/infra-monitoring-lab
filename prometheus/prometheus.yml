global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: lab

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: vps-lab

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: vps-lab

  - job_name: stack
    static_configs:
      - targets:
          - alertmanager:9093
          - loki:3100
          - promtail:9080
          - grafana:3000
          - blackbox:9115

  # Service availability: black-box HTTP probes against each endpoint
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://webapp/healthz
          - http://grafana:3000/api/health
          - http://loki:3100/ready
          - http://alertmanager:9093/-/healthy
          - http://prometheus:9090/-/healthy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
