groups:
  - name: containers
    rules:
      - alert: ContainerDown
        expr: time() - container_last_seen{name!=""} > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} is down"
          description: "cAdvisor has not seen {{ $labels.name }} for more than 60 seconds."

      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 2
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is restarting"
          description: "{{ $labels.name }} restarted {{ $value }} times in 15 minutes."

      - alert: ContainerHighCpuUsage
        expr: sum by (name) (rate(container_cpu_usage_seconds_total{name!=""}[5m])) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high CPU"
          description: "{{ $labels.name }} uses {{ $value | printf \"%.1f\" }}% of one core."

      - alert: ContainerNearMemoryLimit
        expr: container_memory_working_set_bytes{name!=""} / (container_spec_memory_limit_bytes{name!=""} > 0) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} near memory limit"
          description: "{{ $labels.name }} is at {{ $value | printf \"%.1f\" }}% of its memory limit."
