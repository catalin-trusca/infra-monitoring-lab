groups:
  - name: availability
    rules:
      - alert: EndpointDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint {{ $labels.instance }} is down"
          description: "HTTP probe failing for more than 2 minutes."

      - alert: EndpointSlow
        expr: probe_duration_seconds{job="blackbox-http"} > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Endpoint {{ $labels.instance }} is slow"
          description: "Probe duration {{ $value | printf \"%.2f\" }}s (threshold 2s)."

      - alert: ScrapeTargetDown
        expr: up{job!="node"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Scrape target {{ $labels.instance }} ({{ $labels.job }}) is down"
          description: "Prometheus cannot scrape this target."
