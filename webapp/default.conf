server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Used to simulate server errors for the log-based alert
    location = /error {
        return 500;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
