name: monitoring

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  monitoring:
    name: monitoring

volumes:
  prometheus_data:
  alertmanager_data:
  loki_data:
  grafana_data:
  promtail_positions:

services:
  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [monitoring]
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [monitoring]
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./loki/rules:/etc/loki/rules:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [monitoring]
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp/positions
    networks: [monitoring]
    mem_limit: 256m
    depends_on: [loki]
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:3000:3000"
    networks: [monitoring]
    mem_limit: 512m
    depends_on: [prometheus, loki]
    restart: unless-stopped
    logging: *default-logging

  node-exporter:
    security_opt:
        - apparmor:unconfined
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    command:
      - --path.rootfs=/host
      - --collector.systemd
      - --collector.systemd.unit-include=(ssh|docker|fail2ban|ufw|monitoring-stack|monitoring-healthcheck)\.service
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    networks: [monitoring]
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --disable_metrics=percpu,sched,tcp,udp,hugetlb,referenced_memory,advtcp
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [monitoring]
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging

  # Sample workload: gives the stack a real service to probe and real access logs to query
  webapp:
    image: nginx:1.27-alpine
    container_name: webapp
    volumes:
      - ./webapp/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webapp/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "127.0.0.1:8080:80"
    networks: [monitoring]
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging
